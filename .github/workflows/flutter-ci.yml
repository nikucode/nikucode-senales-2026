name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'

defaults:
  run:
    working-directory: app
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get --enforce-lockfile
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Unit and widget tests
        run: flutter test --no-pub --concurrency=1 test/pause_view_model_test.dart test/widget_test.dart test/android_reminder_channel_test.dart

  builds:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [web, linux-debug, android-debug]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux build tools
        if: matrix.target == 'linux-debug'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: actions/setup-java@v6
        if: matrix.target == 'android-debug'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        if: matrix.target == 'android-debug'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get --enforce-lockfile
      - name: Build Web
        if: matrix.target == 'web'
        run: flutter build web --no-pub --no-web-resources-cdn --no-wasm-dry-run
      - name: Build Linux debug bundle
        if: matrix.target == 'linux-debug'
        run: |
          flutter build linux --debug --no-pub
          tar -czf build/nikucode-linux-debug.tar.gz -C build/linux/x64/debug bundle
      - name: Build Android debug APK
        if: matrix.target == 'android-debug'
        run: flutter build apk --debug --no-pub
      - name: Upload Web build
        if: matrix.target == 'web'
        uses: actions/upload-artifact@v7
        with:
          name: nikucode-web-${{ github.sha }}
          path: app/build/web/
          if-no-files-found: error
          retention-days: 7
      - name: Upload Linux debug bundle
        if: matrix.target == 'linux-debug'
        uses: actions/upload-artifact@v7
        with:
          name: nikucode-linux-debug-${{ github.sha }}
          path: app/build/nikucode-linux-debug.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Upload Android debug APK
        if: matrix.target == 'android-debug'
        uses: actions/upload-artifact@v7
        with:
          name: nikucode-android-debug-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
